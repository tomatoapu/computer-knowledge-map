<meta charset="UTF-8">

<title>计算机工科知识地图 · 图 / 板块 / 课程 / 知识点 四层联动</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#fff;--ink:#1f2937;--muted:#667085;--line:#e5eaf2;
  --accent:#3659a8;--accent-soft:#eaf0ff;--side:#17233f;--side2:#223456;
  --green:#dff5e8;--yellow:#fff1c9;--purple:#eee7ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit}
a{color:var(--accent)}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-size:16.5px;font-weight:800;letter-spacing:.2px;cursor:pointer}.brand span{color:var(--accent);font-weight:700}
.top-actions{display:flex;gap:8px;align-items:center}
.search-wrap{position:relative}
.search{width:min(360px,42vw);border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fafbfe;outline:none}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px #3659a81a}
.search-results{position:absolute;top:calc(100% + 6px);right:0;width:min(520px,86vw);max-height:62vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px #16264a22;padding:6px;z-index:30}
.sr-group{font-size:11px;color:var(--muted);padding:7px 10px 3px;letter-spacing:1px}
.sr-item{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:9px;padding:8px 10px;cursor:pointer}
.sr-item:hover{background:var(--accent-soft)}
.sr-item b{font-weight:700}.sr-item small{display:block;color:var(--muted);font-size:12px}
.btn{border:1px solid var(--line);background:white;border-radius:9px;padding:8px 12px;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--accent-soft);border-color:#cad6f8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2c4b91}
.btn.tiny{padding:4px 9px;font-size:12px;border-radius:7px}
.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 60px)}
.sidebar{background:var(--side);color:#edf2ff;padding:18px 12px 40px;position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto}
.side-intro{padding:2px 12px 13px;border-bottom:1px solid #ffffff20;margin-bottom:10px}
.side-intro strong{display:block;font-size:15.5px}.side-intro small{color:#b9c6e4}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 4px 14px}
.quick button{border:1px solid #ffffff22;background:#ffffff0d;color:#e6edff;border-radius:9px;padding:7px 8px;cursor:pointer;font-size:12.5px;text-align:left}
.quick button:hover{background:#3659a8}
.tree{font-size:13px}
.tree .band-title{font-size:11px;letter-spacing:1.2px;color:#8fa3cd;padding:12px 10px 5px;font-weight:700}
.tree details{margin:2px 0}
.tree summary{list-style:none;cursor:pointer;padding:6px 9px;border-radius:8px;display:flex;gap:7px;align-items:center;color:#e8eeff}
.tree summary::-webkit-details-marker{display:none}
.tree summary::before{content:"▸";color:#a9bceb;display:inline-block;transition:transform .15s;flex:none}
.tree details[open]>summary::before{transform:rotate(90deg)}
.tree summary:hover{background:var(--side2)}
.tree .children{padding-left:13px;border-left:1px solid #ffffff24;margin-left:14px}
.tree .leaf,.tree .slink{display:block;width:100%;text-align:left;border:0;background:transparent;color:#cbd6ef;padding:5px 9px;border-radius:7px;cursor:pointer;font-size:12.5px;text-decoration:none}
.tree .leaf:hover,.tree .slink:hover{background:#2f4c86;color:#fff}
.tree .leaf.active,.tree .slink.active{background:#3659a8;color:#fff;font-weight:700}
.tree .done::after{content:" ✓";color:#7ee2a8;font-weight:700}
.main{padding:26px clamp(16px,3.4vw,50px) 60px;max-width:1220px;width:100%;margin:0 auto}
.hero{background:linear-gradient(125deg,#1d3159,#3659a8);border-radius:20px;padding:28px clamp(18px,3.6vw,38px);color:white;box-shadow:0 14px 35px #1b31551a}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:1.8px;color:#c9d8ff;font-weight:700}
.hero h1{font-size:clamp(23px,3.4vw,34px);line-height:1.3;margin:8px 0 12px}
.hero p{max-width:840px;color:#e0e8ff;margin:0}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tag{font-size:12px;border:1px solid #ffffff50;border-radius:99px;padding:4px 10px;color:#f2f5ff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px 16px}
.stat b{display:block;font-size:21px;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}
.content-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:clamp(18px,2.6vw,30px);margin-top:16px;box-shadow:0 4px 18px #182b4a06}
.kicker{font-size:11.5px;color:var(--accent);font-weight:800;letter-spacing:1px}
h2{font-size:24px;margin:5px 0 8px;line-height:1.35}
h3{font-size:17.5px;margin:22px 0 8px}
h4{margin:14px 0 5px;font-size:15px}
.lead{font-size:15.5px;color:#46536a;margin:0 0 18px}
.note{border-left:4px solid #7192dc;background:#f2f6ff;padding:11px 14px;border-radius:0 9px 9px 0;margin:14px 0;color:#344665;font-size:14px}
.warning{border-left-color:#d5a53c;background:#fff8e5}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fcfdff}
.mini h3,.mini h4{margin-top:0}.mini p{margin:5px 0;color:#566176;font-size:14px}
ul,ol{padding-left:22px}li{margin:4px 0}
.path{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.path span{background:var(--accent-soft);color:#2f4d91;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:650}
.path i{color:#94a0b5;font-style:normal}
table{border-collapse:collapse;width:100%;font-size:13.5px;margin:10px 0}
th,td{border-bottom:1px solid var(--line);text-align:left;padding:9px 11px;vertical-align:top}
th{background:#f5f7fc;color:#34425b}
.footer{font-size:12px;color:#7b8495;text-align:center;padding:26px 0}
.hide{display:none!important}
mark{background:#fff0b3;border-radius:3px;padding:0 2px}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb a{text-decoration:none;color:var(--accent)}
.badge{display:inline-block;font-size:11.5px;border-radius:99px;padding:2px 9px;font-weight:700;border:1px solid transparent;white-space:nowrap}
.badge.t-module{background:#eef3ff;color:#33518f;border-color:#cddbfa}
.badge.t-course{background:#e9f7ef;color:#1c7a45;border-color:#c4e8d3}
.badge.t-topic{background:#f4f0ff;color:#6440b6;border-color:#ddd2fb}
.badge.t-domain{background:#fff3e6;color:#a35c10;border-color:#f5dcc0}
.origin{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;border:1px dashed #b9c3d6;color:#5c6a83;background:#f7f9fc;white-space:nowrap}
.origin.o-orig{border-color:#9ec3a8;color:#31704a;background:#f2fbf5}
.origin.o-infer{border-color:#dcc38c;color:#8a6520;background:#fffaf0}
.origin.o-add{border-color:#a9bceb;color:#33518f;background:#f4f7ff}
.rtype{display:inline-block;font-size:11.5px;border-radius:99px;padding:1px 9px;color:#fff;font-weight:700;white-space:nowrap}
.chip{display:inline-block;background:#eef2f8;border-radius:7px;padding:3px 9px;font-size:12.5px;color:#3f4d68;margin:2px 4px 2px 0;border:1px solid #e2e8f4;text-decoration:none;cursor:pointer}
.chip:hover{background:var(--accent-soft);border-color:#cad6f8}
.chip.done{background:#eefbf3;border-color:#c4e8d3;color:#1c7a45}
.rel-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:9px;align-items:center;border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:#fcfdff;margin:7px 0}
.rel-row .side{font-size:13.5px;font-weight:650;color:#2b3a55}
.rel-row .side small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.rel-note{font-size:12.5px;color:#4c5a72;margin:2px 0 0}
.fsvg{width:100%;height:auto;display:block;background:#fbfcff;border:1px solid var(--line);border-radius:14px}
.fsvg .fnode{cursor:pointer}
.fsvg .fnode rect{transition:filter .15s,stroke-width .15s}
.fsvg .fnode:hover rect{filter:drop-shadow(0 4px 10px #1b315533);stroke-width:2.4}
.fsvg .ft{font-size:14px;font-weight:800;fill:#1f2937;pointer-events:none}
.fsvg .fs{font-size:11.5px;fill:#54637d;pointer-events:none}
.fsvg .fedge{cursor:pointer}
.fsvg .fedge path{fill:none;stroke-width:1.8}
.fsvg .fedge:hover path{stroke-width:3}
.fsvg .felab{font-size:11.5px;font-weight:700;pointer-events:none;paint-order:stroke;stroke:#fbfcff;stroke-width:4px;stroke-linejoin:round}
.frame-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 16px}
.frame-tabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 13px;cursor:pointer;font-size:13px}
.frame-tabs button:hover{background:var(--accent-soft)}
.frame-tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:#4c5a72;margin:10px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:22px;height:0;border-top:3px solid #999;border-radius:2px}
.legend i.dash{border-top-style:dashed}
.bar{height:9px;border-radius:99px;background:#e9edf6;overflow:hidden;margin:4px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4d7ee8,#2fbf87);border-radius:99px}
.kv{font-size:13.5px;color:#46536a;margin:3px 0}
.kv b{color:#26344e}
.ta{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:Consolas,Monaco,monospace;font-size:12.5px;background:#fbfcff}
.role{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#4c5a72;margin:6px 0;flex-wrap:wrap}
.section-title{display:flex;align-items:center;gap:9px;margin:22px 0 6px}
.section-title h3{margin:0}
.subtle{color:var(--muted);font-size:12.5px}
.sel{display:block;width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--line);border-radius:8px;background:#fff}
.inp{display:block;width:100%;padding:10px;margin:6px 0 14px;border:1px solid var(--line);border-radius:8px}
pre.out{white-space:pre-wrap;background:#f5f7fc;padding:14px;border-radius:10px;min-height:45px;font-family:inherit;font-size:13.5px;margin:10px 0 0}
.chk{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;user-select:none}
.chk input{width:16px;height:16px}
@media(max-width:900px){
 .layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto;height:auto;max-height:46vh}
 .topbar{padding:10px 12px}.brand{font-size:14.5px}.search{width:52vw}
 .main{padding:16px 12px 40px}.stats{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}
 .rel-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand" id="brand">计算机工科知识地图 <span>· 图 / 板块 / 课程 / 知识点</span></div>
  <div class="top-actions">
    <div class="search-wrap">
      <input id="search" class="search" type="search" placeholder="搜索课程 / 知识点 / 关系：编译器、DSP、傅里叶、先修…">
      <div id="searchResults" class="search-results hide"></div>
    </div>
    <button class="btn" id="expandAll">展开目录</button>
    <button class="btn" id="collapseAll">收起目录</button>
  </div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="side-intro"><strong>知识目录</strong><small>图 → 板块 → 课程 → 知识点，四层双向联动</small></div>
    <div class="quick" id="quickNav"></div>
    <nav id="tree" class="tree" aria-label="知识目录"></nav>
  </aside>
  <main class="main" id="view"></main>
</div>
<script>
/* ==================================================================
   数据区（KB-DATA）：整块可交给 AI 扩充
   节点 type：module 板块 / course 课程 / topic 知识点 / domain 学科总节点
   关系 type：compose 组成 · layer 层级 · prereq 先修 · impl 实现 ·
             apply 应用 · cross 交叉 · contrast 对比
   来源 origin：orig 原图表达 · infer 合理推断 · add 新增补充
   ================================================================== */
/* KB-DATA-START */
const KB_MODULES=[
/* ============ 基础层：两大地基 + 数学 ============ */
{id:"m.math",type:"module",title:"数学与计算理论",short:"数学",band:"base",origin:"orig",
 tags:["数学","理论"],
 summary:"数学提供描述问题、分析算法、建立模型和证明结论的工具。不是每个方向都要同时精通全部数学，但离散数学与逻辑对计算机基础尤其重要。\n\n在全景图中，数学基础位于信号与系统一路的最底层（先修关系），离散数学与逻辑则位于数字逻辑、算法与编译器一路的最底层。",
 points:["数学基础：微积分、线性代数、概率统计、数值计算——公共地基","进阶数学：复变函数、实变函数、泛函分析、调和分析——信号与系统一路的纵深","离散数学与逻辑、自动机与形式语言、算法分析与计算复杂性——计算的理论边界"]},
{id:"m.signal",type:"module",title:"信号与系统（信息处理链）",short:"信号与系统",band:"base",origin:"add",
 tags:["信号","数学","AI"],
 summary:"这是全图的第二条地基：信息如何被数学地描述、变换与处理。\n\n主干来自框架图“信号与系统及其后续课程关系”：数学基础 → 信号与系统 → 数字信号处理 → 数字图像处理 / 语音与音频处理 / 现代信号处理 / 与 AI 的交叉；旁支还有随机信号分析、自动控制原理 → 现代控制理论。补充图进一步给出数学一侧的链条：微积分、线性代数 → 实变函数 → 泛函分析 → 调和分析，以及微积分 → 复变函数 → 调和分析。",
 points:["底层：高等数学、线性代数、概率统计、复变函数等数学工具（先修关系）","主干：信号与系统（连续/离散信号、LTI 系统、傅里叶与拉普拉斯/Z 变换）→ 数字信号处理（采样、DFT/FFT、数字滤波器）","去向：图像、语音、现代信号处理、控制理论，以及与 AI 的交叉（交叉关系，不是简单的上下级）"],
 source:"框架图《信号与系统及其后续课程关系》；补充图：Oppenheim《信号与系统》后续课程链、数学基础链"},
{id:"m.digital",type:"module",title:"数字系统：数字逻辑与计算机硬件",short:"数字系统",band:"base",origin:"orig",
 tags:["硬件","数字逻辑","体系结构"],
 summary:"硬件分支关注信息如何被物理表示、数字电路如何工作，以及处理器怎样执行指令。它可以按器件—电路—逻辑—功能模块—系统逐步理解。\n\n这是全图的第一条地基：框架图给出“硬件实现层级”（器件级 → 电路级 → 逻辑级 → 功能模块级 → 系统级）与对应的课程链（数字系统 → 计算机组成原理 → 指令集架构/处理器执行 → 汇编语言/底层程序 → 操作系统/编译器/运行时 → 计算机体系结构/嵌入式系统/FPGA 与 HDL），底部还给出软件执行路径（高级语言程序 → 编译器/解释器 → 机器指令 → 处理器与运行时执行）。",
 points:["硬件实现层级：器件级 → 电路级 → 逻辑级 → 功能模块级 → 系统级（组成关系逐级向上）","课程链：数字系统 → 计算机组成原理 → 指令集架构 → 汇编/底层程序 → 操作系统/编译器/运行时（先修关系）","软硬件接口：ISA 是软件与处理器之间的桥；CPU 之内继续向下到数字逻辑、电路、晶体管（实现关系）"],
 source:"框架图《数字系统与计算机系统的层级关系》；补充图：计算机系统 → CPU → 功能模块 → 数字逻辑 → 电路 → 晶体管"},
{id:"m.algo",type:"module",title:"算法与数据结构",short:"算法",band:"core",origin:"orig",
 tags:["算法","数据结构"],
 summary:"数据结构组织数据，算法规定解决问题的步骤。算法不是某一种编程语言的专属内容，同一个算法可以用 C、C++、Python 等语言实现。\n\n在全景图中，它与硬件、软件并列为计算机科学的三大支柱之一，向上直接支撑 AI（AI 的算法与模型就建立在这套算法基础之上），向下依赖数学与离散结构。",
 points:["数据结构：数组、链表、栈、队列、哈希表、树、堆、图","算法设计：排序、查找、递归、分治、贪心、动态规划、图算法","代价与正确性：复杂度分析、不变量、正确性证明"]},
{id:"m.programming",type:"module",title:"程序设计与编程语言",short:"程序设计",band:"core",origin:"orig",
 tags:["编程","语言"],
 summary:"程序设计关注如何把问题表达成计算步骤；编程语言则规定程序可以使用哪些语法和语义。语言之间的差别不只是语法，也包括类型、内存和执行模型。\n\n补充图把它拆成三个角度：软件层级（应用软件 / 系统软件）、软件结构（模块·类·函数 / 算法·数据）、软件实现（编译·解释 / 运行时）；再由“程序设计”向下分为编程语言（C/C++/Python）、数据结构、算法。",
 points:["编程基础与语言机制：变量、类型、指针、作用域、类型系统、内存管理","程序组织：模块、接口、抽象、复用、依赖管理","范式与工具：过程式、面向对象、函数式；编译器、调试器、版本控制、构建工具"]},
{id:"m.systems",type:"module",title:"操作系统、编译器与运行时",short:"系统软件",band:"core",origin:"orig",
 tags:["操作系统","编译器","运行时"],
 summary:"系统软件为程序提供运行环境或把程序转换为可执行形式。操作系统、编译器、解释器、虚拟机虽然有关联，但职责不同。\n\n在框架图中，这一层正好接在“汇编语言/底层程序”之上：操作系统、编译器、运行时是硬件之上第一个完整意义上的软件层，它同时依赖数字系统给出的 ISA，又为所有应用提供基础。",
 points:["操作系统：进程与线程、调度、虚拟内存、文件系统、系统调用","编译原理：词法、语法、语义、中间表示 IR、优化、目标代码生成","运行时与工具链：解释器、虚拟机、垃圾回收、汇编/链接/加载、程序分析"]},
/* ============ 应用与系统层 ============ */
{id:"m.data",type:"module",title:"数据、文件与数据库",short:"数据",band:"upper",origin:"orig",
 tags:["数据库","数据工程"],
 summary:"数据分支研究数据如何表示、保存、组织、查询、传输和分析。数据库是数据管理的重要领域，但并不是所有数据都必须存入数据库。\n\n它与算法（索引、查询优化用到数据结构与算法）、系统软件（事务、并发、恢复依赖操作系统与存储）以及 AI（数据是模型训练的原料）都有交叉关系。"},
{id:"m.network",type:"module",title:"计算机网络与分布式系统",short:"网络",band:"upper",origin:"orig",
 tags:["网络","分布式"],
 summary:"网络让独立设备交换信息；分布式系统进一步研究多个计算节点如何协作，并面对延迟、故障和数据一致性等问题。\n\n它建立在操作系统之上（进程、套接字、并发），并被云计算、分布式 AI 训练、大型软件系统普遍使用。"},
{id:"m.engineering",type:"module",title:"软件工程、测试与安全",short:"软件工程",band:"upper",origin:"orig",
 tags:["工程","测试","安全"],
 summary:"软件工程关注如何可靠地构建和维护软件；测试、安全与质量不是最后才补上的装饰，而应贯穿需求、设计、编码和部署。\n\n它与程序设计和系统软件是交叉关系：工程方法用来组织代码与团队，而安全又直接建立在操作系统、编译器和网络的知识之上。"},
{id:"m.ai",type:"module",title:"人工智能",short:"AI",band:"upper",origin:"orig",
 tags:["AI","机器学习","深度学习"],
 summary:"人工智能不是孤立于计算机基础之外的分支。它大量依赖数学、算法、数据、硬件和软件系统，同时又形成了自己的模型、训练和评估方法。\n\n框架图把它画成三根柱子：算法与模型（机器学习、深度学习、其他算法与模型）、软件与系统（AI 系统、模型训练系统、推理系统、AI 应用）、计算硬件（CPU、GPU、TPU/专用加速器）。它与硬件、软件、算法三者都是双向的交叉/支撑关系——这是理解 AI 的关键：AI 不是“上面一层”，而是横跨整张图的一条线。",
 points:["算法与模型：机器学习、深度学习、其他算法与模型（依赖线性代数、概率统计、优化与算法基础）","软件与系统：AI 系统、模型训练系统、推理系统、AI 应用（属于软件与系统，不是算法本身）","计算硬件：CPU、GPU、TPU/专用加速器（AI 反过来推动硬件设计）"]},
{id:"m.sysapp",type:"module",title:"计算机系统与应用场景",short:"系统与应用",band:"upper",origin:"orig",
 tags:["系统","应用"],
 summary:"“计算机系统”通常指硬件、软件、数据和接口协同工作的整体，不是排在硬件下面的一层。不同系统类型也会重叠。\n\n在全景图中，计算机系统由硬件 + 软件 + 算法协同工作构成，向上支撑计算机视觉、自然语言处理、机器人、嵌入式、高性能计算等应用领域。"},
/* ============ 视角与规划 ============ */

 summary:"同一个概念可以同时属于多个视角。不要强行把所有知识塞进唯一的一棵树；先判断自己正在回答哪一种问题。\n\n本页的四层导航（图 → 板块 → 课程 → 知识点）只是其中一种切法；下面六种“地图”可以套在任何节点上使用。"},
{id:"m.levels",type:"module",title:"核心基础—核心框架—实验平台",short:"三层视角",band:"meta",origin:"orig",
 tags:["方法论"],
 summary:"这是一种组织学习内容的实用视角，不是唯一的学科分类标准。核心基础关注理论依据，核心框架关注专业原理与系统结构，实验平台关注实现、验证与测量。三者会反复互动，不是只能单向从上到下学习。"},
{id:"m.personal",type:"module",title:"个人规划：学习、研究、就业",short:"个人规划",band:"meta",origin:"orig",

/* ---------- 算法与数据结构 ---------- */
{id:"c.ds",type:"course",title:"数据结构",short:"数据结构",parent:"m.algo",origin:"orig",
 summary:"数组、链表、栈、队列、哈希表、树、堆、图。理解每种结构如何存储数据，以及查询、插入、删除的代价。\n\n它是编程语言、数据库、操作系统、编译器共同的先修：所有系统都要在某种数据结构上组织自己的信息。"},
{id:"c.algodesign",type:"course",title:"算法设计与分析",short:"算法设计",parent:"m.algo",origin:"orig",
 summary:"排序、查找、递归、分治、贪心、动态规划、回溯、搜索、图遍历、最短路径、最小生成树。\n\n它与数据结构互为先修（数据结构提供表示、算法提供步骤），并向下依赖离散数学与复杂度分析。"},
{id:"c.algo_correct",type:"course",title:"复杂度与正确性",short:"复杂度与正确性",parent:"m.algo",origin:"orig",
 summary:"时间复杂度、空间复杂度、边界情况、不变量、循环终止、正确性证明。程序能运行不等于算法一定正确或高效。"},
{id:"c.adv_algo",type:"course",title:"进阶算法",short:"进阶算法",parent:"m.algo",origin:"orig",
 summary:"随机算法、近似算法、在线算法、并行算法、优化算法。根据课程和研究方向逐步学习。\n\n它向上与人工智能（优化）、高性能计算（并行算法）交叉。"},
/* ---------- 程序设计与编程语言 ---------- */
{id:"c.cpp",type:"course",title:"高级语言程序设计（C / C++ / Python）",short:"程序设计",parent:"m.programming",origin:"orig",
 summary:"变量、类型、表达式、条件、循环、函数、数组、指针、结构体、文件、错误处理。建议用 C/C++ 建立底层理解，再按需求学习其他语言。\n\n补充图把 C/C++/Python 画成“软件 ↔ 硬件之桥”的起点：源代码经编译器/解释器变成中间表示，再变成机器指令。",
 points:["C/C++：贴近内存与硬件，适合理解指针、结构体、编译链接","Python：表达快、生态广，适合数据与 AI 方向","同一算法可以用不同语言实现，语言差别不只在语法"]},
{id:"c.prog_org",type:"course",title:"程序组织与模块化",short:"程序组织",parent:"m.programming",origin:"orig",
 summary:"模块、接口、抽象、封装、复用、依赖管理。大型程序通常由多个相互协作的模块构成。\n\n补充图把“软件结构”列为软件的一个观察角度：模块 / 类 / 函数，以及算法 / 数据。"},
{id:"c.plt",type:"course",title:"编程语言原理（语言机制与范式）",short:"语言原理",parent:"m.programming",origin:"orig",
 summary:"语言机制：作用域、名字绑定、类型系统、静态/动态类型、值与引用、内存管理、异常、泛型、多态、并发机制。\n\n编程范式：过程式、面向对象、函数式、声明式、事件驱动等。它们是组织和表达程序的不同方式，不一定互斥。\n\n它与编译原理是交叉关系：语言机制决定了编译器要处理什么。"},
{id:"c.tools",type:"course",title:"开发工具链",short:"开发工具",parent:"m.programming",origin:"orig",
 summary:"编辑器、编译器、解释器、调试器、版本控制、构建工具、包管理器、测试框架。\n\n注意区分（对比关系）：编译器/解释器属于语言实现，构建工具与版本控制属于工程协作工具，它们常被混在一起称为“工具链”。"},
/* ---------- 操作系统、编译器与运行时 ---------- */
{id:"c.os",type:"course",title:"操作系统",short:"操作系统",parent:"m.systems",origin:"orig",
 summary:"进程与线程、CPU 调度、虚拟内存、文件系统、设备管理、系统调用、同步互斥、死锁、权限。操作系统协调程序与硬件资源。\n\n它是所有系统课程的枢纽：向下依赖 ISA 与存储层次，向上支撑网络、数据库、安全与所有应用程序。"},
{id:"c.compiler",type:"course",title:"编译原理",short:"编译器",parent:"m.systems",origin:"orig",
 summary:"词法分析、语法分析、语义分析、中间表示（IR）、优化、目标代码生成。编译器把一种程序表示转换成另一种表示。\n\n在“软件 ↔ 硬件之桥”里，编译器/解释器正是从高级语言通向机器指令的那一段。",
 points:["前端：词法、语法、语义分析（依赖自动机与形式语言）","中端：中间表示 IR 与优化","后端：目标代码生成（依赖指令集与体系结构）"]},
{id:"c.vm",type:"course",title:"解释器与虚拟机",short:"解释器/VM",parent:"m.systems",origin:"orig",
 summary:"解释执行、字节码、虚拟机指令、运行时栈、对象管理、垃圾回收。解释器通常在运行时分析或执行程序表示；具体实现方式因语言而异。\n\n与编译器是<b>对比关系</b>：两者都把程序翻译成可执行形式，但翻译时机与执行方式不同，职责不能互相替代。"},
{id:"c.toolchain",type:"course",title:"汇编、链接、加载与构建",short:"工具链",parent:"m.systems",origin:"orig",
 summary:"汇编器把汇编指令转换成机器码；链接器组合目标文件和库；加载器把程序装入运行环境；构建系统组织整个生成流程。"},
{id:"c.lifecycle",type:"course",title:"程序生命周期",short:"生命周期",parent:"m.systems",origin:"orig",
 summary:"源代码 → 构建/翻译 → 可执行文件或中间代码 → 加载 → 运行 → 测试与维护。老师所说的“源码层、构建层、运行层”可理解为观察这个过程的三个角度，但具体含义应以课堂定义为准。"},
{id:"c.proganalysis",type:"course",title:"程序分析与优化",short:"程序分析",parent:"m.systems",origin:"orig",
 summary:"静态分析在不实际运行程序或不依赖某次运行结果的情况下分析代码性质；动态分析观察程序运行时行为；优化关注正确性约束下的效率提升。\n\n它是编译器（优化）、软件工程（质量）与安全（漏洞检测）交叉的地带。"},
/* ---------- 数据、文件与数据库 ---------- */
{id:"c.file",type:"course",title:"数据表示与文件",short:"文件",parent:"m.data",origin:"orig",
 summary:"文本、图像、音频、视频、二进制文件、目录结构、文件格式、序列化、持久化。\n\n它向下与数制与数据表示相连（位模式），向上与数据工程相连（如何组织海量文件）。"},
{id:"c.db",type:"course",title:"数据库基础",short:"数据库基础",parent:"m.data",origin:"orig",
 summary:"关系模型、表、行、列、主键、外键、SQL、关系代数、函数依赖、规范化。\n\n它大量使用离散数学（关系代数、函数依赖），并用数据结构实现索引。"},
{id:"c.dbsys",type:"course",title:"数据库系统",short:"数据库系统",parent:"m.data",origin:"orig",
 summary:"索引、查询处理与优化、事务、并发控制、恢复、权限与备份。\n\n它是操作系统（并发、I/O、日志）与算法（索引结构、查询优化）的直接应用。"},
{id:"c.dataeng",type:"course",title:"数据工程与分析",short:"数据工程",parent:"m.data",origin:"orig",
 summary:"数据清洗、ETL、数据仓库、数据湖、分布式存储、统计分析与可视化。\n\n它向下依赖数据库与分布式系统，向 AI 提供训练数据（交叉关系）。"},
/* ---------- 计算机网络与分布式系统 ---------- */
{id:"c.net",type:"course",title:"网络基础",short:"网络基础",parent:"m.network",origin:"orig",
 summary:"分层模型、局域网、交换与路由、IP 地址、子网、DNS、TCP、UDP、HTTP/HTTPS。"},
{id:"c.netprog",type:"course",title:"网络编程",short:"网络编程",parent:"m.network",origin:"orig",
 summary:"客户端与服务器、Socket、请求与响应、超时、重试、并发连接、协议设计。\n\n它直接建立在操作系统之上：Socket 是操作系统提供给程序的网络接口（应用关系）。"},
{id:"c.dist",type:"course",title:"分布式系统",short:"分布式",parent:"m.network",origin:"orig",
 summary:"节点协作、复制、一致性、容错、故障检测、分布式事务、消息队列。\n\n它是算法（共识、一致性）与网络（通信）交叉最深的领域之一。"},
{id:"c.cloud",type:"course",title:"云计算与虚拟化",short:"云计算",parent:"m.network",origin:"orig",
 summary:"虚拟机、容器、云服务、弹性伸缩、部署、监控。虚拟化与容器技术帮助共享和管理计算资源。\n\n它依赖操作系统（进程、隔离、资源管理）与分布式系统（调度、容错）。"},
/* ---------- 软件工程、测试与安全 ---------- */
{id:"c.se",type:"course",title:"软件开发过程",short:"开发过程",parent:"m.engineering",origin:"orig",
 summary:"需求分析、系统设计、模块划分、编码规范、代码评审、版本控制、持续集成与部署、维护。"},
{id:"c.test",type:"course",title:"测试与调试",short:"测试与调试",parent:"m.engineering",origin:"orig",
 summary:"单元测试、集成测试、系统测试、回归测试、断言、日志、断点、最小复现、边界测试。\n\n它与程序分析（静态/动态分析）是交叉关系：很多测试工具建立在分析技术之上。"},
{id:"c.quality",type:"course",title:"软件质量",short:"软件质量",parent:"m.engineering",origin:"orig",

{id:"c.security",type:"course",title:"计算机安全",short:"安全",parent:"m.engineering",origin:"orig",
 summary:"身份认证、授权、密码学基础、漏洞、输入验证、内存安全、系统安全、隐私保护、威胁建模。\n\n它依赖操作系统（权限、隔离）、网络（攻击面）、编译与程序分析（漏洞检测），是典型的交叉领域。"},
/* ---------- 人工智能 ---------- */

{id:"c.ml",type:"course",title:"机器学习",short:"机器学习",parent:"m.ai",origin:"orig",

{id:"c.ai_sub",type:"course",title:"AI 子领域",short:"AI 子领域",parent:"m.ai",origin:"orig",

{id:"c.llm",type:"course",title:"大模型与应用系统",short:"大模型",parent:"m.ai",origin:"orig",

{id:"c.ai_sys",type:"course",title:"AI 软件与系统",short:"AI 系统",parent:"m.ai",origin:"add",
 summary:"AI 系统、模型训练系统、推理系统、AI 应用。\n\n框架图特意把这一列与“算法与模型”“计算硬件”并列：它们属于<b>软件与系统</b>，不是算法本身。区分这三者是理解 AI 工程的关键。",
 points:["训练系统：数据管线、分布式训练、检查点","推理系统：批处理、量化、缓存、服务化部署","AI 应用：面向具体场景的产品形态"]},

{id:"t.mordsp_psd",type:"topic",title:"谱估计",parent:"c.mordsp",origin:"orig",
 summary:"从有限观测数据估计功率谱：经典方法与现代参数化方法。"},
{id:"t.mordsp_adapt",type:"topic",title:"自适应滤波",parent:"c.mordsp",origin:"orig",
 summary:"滤波器参数随输入自动调整：回声消除、信道均衡、噪声对消等。"},
{id:"t.mordsp_stat",type:"topic",title:"统计信号处理",parent:"c.mordsp",origin:"orig",
 summary:"在噪声中做检测与估计：假设检验、参数估计、匹配滤波。"},
{id:"t.ai_sig_feat",type:"topic",title:"信号特征与表示",parent:"c.sig_ai",origin:"infer",
 summary:"把信号变换成模型友好的表示：频谱、时频图、小波、嵌入向量。这是信号处理与 AI 之间最直接的一座桥。"},
{id:"t.ai_sig_model",type:"topic",title:"用深度学习做信号任务",parent:"c.sig_ai",origin:"infer",
 summary:"用神经网络替代或增强传统滤波、重建、分割与识别流程；反过来也用信号处理方法解释与改进模型。"},
{id:"t.ctrl_fb",type:"topic",title:"反馈与稳定性",parent:"c.control",origin:"add",
 summary:"闭环反馈、稳定性判据、稳态误差。控制系统与信号系统共享同一套变换工具。"},
{id:"t.ctrl_freq",type:"topic",title:"频域方法",parent:"c.control",origin:"add",
 summary:"频率响应、波特图、根轨迹与频域校正设计。"},
{id:"t.mc_state",type:"topic",title:"状态空间方法",parent:"c.modcontrol",origin:"add",
 summary:"用状态方程描述系统，讨论能控性、能观性、极点配置与最优控制。与线性代数关系紧密。"},
{id:"t.comm_mod",type:"topic",title:"调制与解调",parent:"c.comm",origin:"add",
 summary:"把信息搬到适合信道传输的频段：调幅、调频、数字调制。"},
{id:"t.comm_ch",type:"topic",title:"信道与噪声",parent:"c.comm",origin:"add",
 summary:"信道模型、噪声与干扰、误码率与信道编码的基本概念。"},
/* ===== 数字系统：硬件实现层级 ===== */
{id:"t.lv_device",type:"topic",title:"器件级",parent:"m.digital",origin:"orig",
 summary:"研究对象：晶体管等基础器件。典型概念：MOS 管、晶体管。\n\n它是硬件实现层级的最底层，由它构成电路级（组成关系）。"},
{id:"t.lv_circuit",type:"topic",title:"电路级",parent:"m.digital",origin:"orig",
 summary:"研究对象：电路行为（电压、电流等）。典型概念：电路图、信号。\n\n由器件构成；再向上构成逻辑级。"},
{id:"t.lv_logic",type:"topic",title:"逻辑级",parent:"m.digital",origin:"orig",
 summary:"研究对象：逻辑门、布尔逻辑、组合逻辑、时序逻辑。典型概念：门电路、时序图。\n\n它对应数字逻辑与数字电路课程，向上构成功能模块级。"},
{id:"t.lv_module",type:"topic",title:"功能模块级",parent:"m.digital",origin:"orig",
 summary:"研究对象：寄存器、计数器、运算器、控制器等。典型概念：寄存器、ALU、控制单元。\n\n它对应计算机组成原理中的模块设计与 RTL 数据通路，向上构成系统级。"},
{id:"t.lv_system",type:"topic",title:"系统级",parent:"m.digital",origin:"orig",
 summary:"研究对象：CPU、存储器、总线、输入输出等。典型概念：指令集、总线、内存。\n\n它是硬件实现层级的顶端，向上以 ISA 为接口交给软件（实现/接口关系）。"},
{id:"t.rtl_datapath",type:"topic",title:"数据通路与 RTL 描述",parent:"c.rtl",origin:"add",
 summary:"把 ALU、寄存器堆、控制器连接成一条能按节拍执行指令的通路，并用 RTL 精确描述每个时钟沿发生什么。\n\n它向上服务功能模块级，向下落到组合/时序逻辑（实现关系）。"},
{id:"t.asm_lang",type:"topic",title:"汇编语言",parent:"c.asm",origin:"add",
 summary:"机器指令的可读形式：助记符、寻址方式、寄存器与栈的使用、调用约定。\n\n它是“人能读的机器指令”，也是理解操作系统与编译器如何协作的必备层。"},
{id:"t.arch_pipe",type:"topic",title:"流水线与并行",parent:"c.arch",origin:"add",
 summary:"指令级并行、流水线冒险与解决、多核与并行体系结构：体系结构课程中最影响性能的部分。"},
{id:"t.transistor",type:"topic",title:"晶体管与 MOS 管",parent:"c.semiconductor",origin:"add",
 summary:"用半导体器件的开关与放大特性实现 0/1。它是“数字”这件事的物理起点——所有逻辑最终都由它实现。"},
{id:"t.ir",type:"topic",title:"中间表示 IR",parent:"c.compiler",origin:"add",
 summary:"编译器在拿到高级语言后，先转成与具体机器无关的中间表示（如三地址码、SSA、LLVM IR），在 IR 上做优化，再生成机器指令。\n\n补充图“软件 ↔ 硬件之桥”把 IR 单独画成一环：它是软件与硬件之间真正的分水岭——IR 以上与机器无关，IR 以下开始依赖 ISA。"},
{id:"t.mcode",type:"topic",title:"机器指令",parent:"c.isa",origin:"add",
 summary:"处理器真正执行的东西：由操作码、寄存器/内存操作数与寻址方式构成。\n\n它的“合法形式”由 ISA 规定，因此机器指令是软件与硬件之间的契约文本——同一个程序在不同 ISA 上要重新生成不同的机器指令。"},
/* ===== 算法 ===== */
{id:"t.ds_basic",type:"topic",title:"基础数据结构",parent:"c.ds",origin:"orig",
 summary:"数组、链表、栈、队列、哈希表、树、堆、图。理解每种结构如何存储数据，以及查询、插入、删除的代价。"},
{id:"t.algo_basic",type:"topic",title:"基本算法",parent:"c.algodesign",origin:"orig",
 summary:"排序、查找、递归、分治、贪心、动态规划、回溯、搜索、图遍历、最短路径、最小生成树。"},
/* ===== 程序设计与编程语言 ===== */
{id:"t.prog_basic",type:"topic",title:"编程基础",parent:"c.cpp",origin:"orig",
 summary:"变量、类型、表达式、条件、循环、函数、数组、指针、结构体、文件、错误处理。建议用 C/C++ 建立底层理解，再按需求学习其他语言。"},
{id:"t.pl_mech",type:"topic",title:"语言机制",parent:"c.plt",origin:"orig",
 summary:"作用域、名字绑定、类型系统、静态/动态类型、值与引用、内存管理、异常、泛型、多态、并发机制。"},
{id:"t.pl_paradigm",type:"topic",title:"编程范式",parent:"c.plt",origin:"orig",
 summary:"过程式、面向对象、函数式、声明式、事件驱动等。它们是组织和表达程序的不同方式，不一定互斥。"},

{id:"t.ai_train",type:"topic",title:"模型训练系统",parent:"c.ai_sys",origin:"orig",
 summary:"数据管线、分布式训练、检查点与实验管理。框架图把它单列，说明它属于软件系统，而不是算法本身。"},
{id:"t.ai_infer",type:"topic",title:"推理系统",parent:"c.ai_sys",origin:"orig",
 summary:"把训练好的模型高效地跑起来：批处理、量化、缓存、服务化与监控。"},

/* ===== 多视角地图 ===== */
{id:"t.map_object",type:"topic",title:"对象地图：它是什么",parent:"m.maps",origin:"orig",
 summary:"硬件、软件、算法、数据、系统、网络、人工智能等。\n\n先分清对象类别，再谈它属于哪个板块：本站用节点类型（板块 / 课程 / 知识点）与所属板块来表达这一点。"},
{id:"t.map_layer",type:"topic",title:"层级地图：它在哪里",parent:"m.maps",origin:"orig",
 summary:"从物理器件、数字电路、处理器与指令接口，到操作系统、运行环境和应用程序。不同模型的层级划分可能不同。\n\n本站用<b>层级关系</b>与两大地基（数字系统、信号与系统）表达层级位置。"},
{id:"t.map_structure",type:"topic",title:"结构地图：它由什么组成",parent:"m.maps",origin:"orig",
 summary:"例如软件系统可拆分成模块，模块可包含函数和数据；硬件系统可拆分成处理器、存储器和 I/O。\n\n本站用<b>组成关系</b>表达“由什么构成”。"},
{id:"t.map_lifecycle",type:"topic",title:"生命周期地图：它如何产生和运行",parent:"m.maps",origin:"orig",
 summary:"需求 → 设计 → 编码 → 构建/翻译 → 加载 → 执行 → 测试 → 维护。\n\n本站用程序生命周期课程与“软件 ↔ 硬件之桥”表达这条线。"},
{id:"t.map_relation",type:"topic",title:"关系地图：它如何连接",parent:"m.maps",origin:"orig",
 summary:"组成、依赖、调用、翻译、实现、通信、协作、竞争。\n\n本站把这些压缩成七种带类型的箭头，并在<b>关系浏览器</b>中全部列出。"},
{id:"t.map_angle",type:"topic",title:"角度地图：我在研究什么",parent:"m.maps",origin:"orig",
 summary:"结构、功能、实现、执行过程、性能、安全、可靠性、可维护性。\n\n同一个节点可以从不同角度研究：例如操作系统既可以从“结构”看，也可以从“性能”或“安全”看。"},
/* ===== 三层视角 ===== */
{id:"t.lv_core_base",type:"topic",title:"核心基础：理论依据",parent:"m.levels",origin:"orig",
 summary:"回答“为什么成立、如何证明、怎样建模”。计算机方向常见内容包括离散数学、逻辑、算法与复杂度、概率统计、形式语言、计算模型等。不同研究方向依赖的数学并不相同。"},
{id:"t.lv_core_frame",type:"topic",title:"核心框架：专业原理",parent:"m.levels",origin:"orig",
 summary:"回答“如何组织成一个系统、系统怎样工作”。计算机方向包括数据结构与算法、计算机组成、操作系统、编译原理、程序语言、数据库、网络、人工智能等。它们不是单纯的应用层，而是各自的核心知识体系。"},
{id:"t.lv_platform",type:"topic",title:"实验平台：实现与验证",parent:"m.levels",origin:"orig",
 summary:"回答“怎样做出来、运行起来并验证”。例如 C/C++、调试器、编译器工具链、LLVM、仿真环境、测试框架、性能分析工具、FPGA 或单片机平台。平台是工具与实践载体，不等同于理论本身。"},
{id:"t.lv_loop",type:"topic",title:"三者如何循环",parent:"m.levels",origin:"orig",
 summary:"先用理论建立模型，再依据专业原理实现，用实验观察结果；如果结果与预期不符，就回到模型、实现或假设中排查。实践不必等到理论全部学完才开始。"},
{id:"t.lv_bound",type:"topic",title:"这套分类的边界",parent:"m.levels",origin:"orig",
 summary:"它适合规划学习，不是普适的严格分类。不同层次混合了理论、专业知识和工具三个维度；某些内容可能同时属于多个维度。例如 MATLAB 既是工具，也能用于数值计算实验；程序分析既有理论，也有工程工具。"},
{id:"t.lv_major",type:"topic",title:"与你方向的对应关系",parent:"m.levels",origin:"orig",
 summary:"核心基础：离散数学、逻辑、算法、形式语言；核心框架：编译原理、解释器、类型系统、程序分析与优化；实验平台：C/C++、LLVM、调试器、测试与性能分析。建议理论和项目同步推进。"},
/* ===== 个人规划 ===== */
{id:"t.pg_goal",type:"topic",title:"先确定目标与约束",parent:"m.personal",origin:"orig",
 summary:"分别写清楚：考研目标（专业课与数学要求）、保研或竞赛需求、每周可投入时间、导师与实验室资源、毕业后偏研发还是偏应用。目标变化时，路线也可以调整。"},
{id:"t.pg_common",type:"topic",title:"共同基础：不要过早押注",parent:"m.personal",origin:"orig",
 summary:"C/C++、数据结构与算法、离散数学、计算机组成、操作系统、计算机网络、数据库、软件工程与 Git。它们能支撑多种岗位和研究方向。"},
{id:"t.pg_a",type:"topic",title:"方向 A：编译器与程序语言",parent:"m.personal",origin:"orig",
 summary:"学习编译原理、解释器、虚拟机、类型系统、静态分析和优化；做一个能运行的解释器或小型语言工具，再逐步加入类型检查、错误定位、数据流分析或优化。适合喜欢语言机制、底层原理和长期钻研的人。\n\n对应本站：程序设计与编程语言 → 操作系统、编译器与运行时，可在课程页的“关系一览”里横向跳转。"},
{id:"t.pg_b",type:"topic",title:"方向 B：系统软件与基础设施",parent:"m.personal",origin:"orig",
 summary:"学习 Linux、操作系统、并发、网络、性能分析、内存与调试；做系统工具、运行时组件、存储或性能优化项目。它和编译器有交集，也有较广泛的软件工程迁移能力。"},
{id:"t.pg_c",type:"topic",title:"方向 C：AI 工程与应用",parent:"m.personal",origin:"orig",
 summary:"补足线性代数、概率统计、优化和机器学习基础，同时训练数据处理、模型评估、部署和工程能力。应用机会多，但竞争与技术迭代也快；不能只停留在调用模型 API。\n\n对应本站：人工智能板块的算法与模型、软件与系统、计算硬件三根柱子要同时补。"},
{id:"t.pg_d",type:"topic",title:"方向 D：软件开发与平台工程",parent:"m.personal",origin:"orig",
 summary:"强化工程实践、后端/客户端、数据库、测试、部署、协作与项目交付。通常更容易形成可展示的项目经历，也可作为底层方向的就业备选能力。"},
{id:"t.pg_plan",type:"topic",title:"阶段计划：未来 12 个月",parent:"m.personal",origin:"orig",
 summary:"第 1–3 个月：巩固 C/C++、数据结构、离散数学；第 4–6 个月：学计算机组成、操作系统和编译原理入门；第 7–9 个月：完成解释器或编译器小项目；第 10–12 个月：根据进展选一个研究问题，阅读论文、复现实验，并准备考研/实习所需能力。具体节奏应结合课程与考试安排调整。"},
{id:"t.pg_review",type:"topic",title:"每学期复盘",parent:"m.personal",origin:"orig",
 summary:"每 8–12 周检查：学会了哪些可解释的概念？完成了什么可运行项目？是否有测试和文档？哪些课程成绩需要补强？是否仍喜欢这个方向？如果连续投入后发现不合适，可以转向相邻方向，而不是把前期学习视为浪费。"},
{id:"t.pg_major",type:"topic",title:"专业与学院方向参考",parent:"m.personal",origin:"add",
 summary:"补充资料里给出的相关专业分布：电子信息类（电子信息工程、通信工程、信息对抗技术、物联网工程、网络工程）；电子类（电子科学与技术、电磁场与无线技术、电波传播与天线、微电子科学与工程）；计算机类（计算机科学与技术、网络空间安全、人工智能、数据科学与大数据技术）。\n\n资料里还有一句值得记下来的话：通信类方向比计算机类方向用到的数学更多——选方向时，可以先看一眼它在全图中离数学那一边有多近（信号与系统、随机信号分析、通信原理这条线）。",
 source:"补充图：院校与专业结构"},
{id:"t.pg_advice",type:"topic",title:"拿这张地图去问问题",parent:"m.personal",origin:"add",
 summary:"这张地图最有用的用法不是背，而是提问：\n\n① 我想做某个方向（比如自动驾驶），需要哪些板块的知识？——从“集成系统”节点沿关系往回走。\n② 我这门课学不动，缺什么？——打开课程页看“前置知识”。\n③ 两个都感兴趣的方向，交集在哪？——用关系浏览器筛“交叉”类型。\n④ 学的东西以后有什么用？——看“后续知识”与“应用关系”。"},

{id:"e.calc.signals",from:"t.calculus",to:"c.signals",type:"prereq",label:"先修",origin:"orig",
 note:"框架图把“数学基础”方框整体作为信号与系统的先修；本站把它拆到具体课程上，微积分是其中的连续量分析基础。"},
{id:"e.linalg.signals",from:"t.linalg",to:"c.signals",type:"prereq",label:"先修",origin:"orig",
 note:"框架图“数学基础 → 信号与系统”这条先修箭头中的线性代数部分：LTI 系统的描述与求解离不开线性空间与矩阵。"},
{id:"e.prob.signals",from:"t.prob",to:"c.signals",type:"prereq",label:"先修",origin:"orig",
 note:"框架图“数学基础 → 信号与系统”中的概率统计部分；到随机信号分析、通信原理时会变成主要工具。"},
{id:"e.harmonic.signals",from:"c.harmonic",to:"c.signals",type:"cross",label:"数学支撑",origin:"infer",
 note:"调和分析与信号与系统是交叉关系（不是先修）：一边是傅里叶分析的数学理论，一边是它的工程对象与解释。补充图把调和分析列在数学链末端，本站据其含义建立这条交叉关系。"},
{id:"e.discrete.diglogic",from:"c.discrete",to:"c.diglogic",type:"prereq",label:"先修",origin:"infer",
 note:"合理推断：数字逻辑的核心工具是布尔代数与逻辑运算，它们属于离散数学与逻辑的内容；框架图把离散数学列入数学基础方框，本站把它与逻辑级的课程连起来。"},
{id:"e.discrete.automata",from:"c.discrete",to:"c.automata",type:"prereq",label:"先修",origin:"infer",
 note:"合理推断：集合、关系、证明方法是自动机与形式语言课程的前置工具。"},
{id:"e.discrete.ds",from:"c.discrete",to:"c.ds",type:"prereq",label:"先修",origin:"infer",
 note:"合理推断：图论、组合计数直接用于数据结构与算法分析。"},
{id:"e.discrete.db",from:"c.discrete",to:"c.db",type:"prereq",label:"先修",origin:"infer",
 note:"合理推断：关系代数与函数依赖建立在集合与关系之上。"},
/* ================= 二、信号与系统及其后续课程（主框架图） ================= */
{id:"e.signals.dsp",from:"c.signals",to:"c.dsp",type:"prereq",label:"先修",origin:"orig",
 note:"框架图主链：信号与系统 → 数字信号处理。掌握连续/离散信号与变换之后才能学采样、DFT 与数字滤波器。"},
{id:"e.signals.dsp.cross",from:"c.signals",to:"c.dsp",type:"cross",label:"交叉应用",origin:"orig",
 note:"框架图在两者之间额外标注的“交叉应用”虚线：连续时间方法（拉普拉斯、频域分析）与离散方法（Z 变换、DFT）互相借用、互相验证。同一条线上可以同时存在先修与交叉两种关系——这也是不能把所有箭头都当成先修的原因。"},
{id:"e.dsp.random_sig",from:"c.dsp",to:"c.random_sig",type:"prereq",label:"先修",origin:"add",
 note:"补充图：数字信号处理 → 随机信号分析。随机信号建立在确定信号变换方法之上。"},
{id:"e.dsp.mordsp",from:"c.dsp",to:"c.mordsp",type:"prereq",label:"先修",origin:"orig",
 note:"框架图：数字信号处理 → 现代信号处理（谱估计、自适应滤波、统计处理）。"},
{id:"e.random_sig.mordsp",from:"c.random_sig",to:"c.mordsp",type:"prereq",label:"先修",origin:"add",
 note:"补充图：随机信号分析 → 现代信号处理。统计信号处理直接依赖随机过程与功率谱的知识。"},
{id:"e.dsp.dip",from:"c.dsp",to:"c.dip",type:"prereq",label:"先修",origin:"orig",
 note:"框架图：数字信号处理 → 数字图像处理。图像是二维信号，滤波、变换方法由一维推广而来。"},
{id:"e.dsp.speech",from:"c.dsp",to:"c.speech",type:"prereq",label:"先修",origin:"orig",
 note:"框架图：数字信号处理 → 语音与音频处理。音频采样与频谱分析直接复用 DSP 的方法。"},
{id:"e.dsp.sig_ai",from:"c.dsp",to:"c.sig_ai",type:"cross",label:"交叉应用",origin:"orig",
 note:"框架图用虚线把数字信号处理与“与 AI 的交叉”连起来，标注为交叉应用：信号处理提供特征与变换，机器学习提供建模能力。"},
{id:"e.sig_ai.ml",from:"c.sig_ai",to:"c.ml",type:"cross",label:"交叉应用",origin:"orig",
 note:"框架图在“与 AI 的交叉”节点下列出机器学习：两边方法互相使用，不存在谁包含谁。"},
{id:"e.sig_ai.dl",from:"c.sig_ai",to:"c.dl",type:"cross",label:"交叉应用",origin:"orig",
 note:"框架图在“与 AI 的交叉”节点下列出深度学习；深度学习大量用于图像、语音与信号任务。"},
{id:"e.sig_ai.ai_sub",from:"c.sig_ai",to:"c.ai_sub",type:"cross",label:"交叉应用",origin:"orig",
 note:"框架图在“与 AI 的交叉”节点下列出计算机视觉；它与数字图像处理是同一问题的两种技术路线。"},
{id:"e.dip.ai_sub",from:"c.dip",to:"c.ai_sub",type:"cross",label:"交叉应用",origin:"infer",
 note:"合理推断（与框架图一致）：图像处理与计算机视觉互为交叉——前者偏变换与增强，后者偏理解与识别。"},
{id:"e.speech.ai_sub",from:"c.speech",to:"c.ai_sub",type:"cross",label:"交叉应用",origin:"infer",
 note:"合理推断：语音特征与语音识别既属于信号处理，也属于 AI 的语音子领域。"},
{id:"e.signals.control",from:"c.signals",to:"c.control",type:"prereq",label:"先修",origin:"add",
 note:"补充图：信号与系统 → 自动控制原理。系统建模与稳定性分析共用拉普拉斯变换与频域方法。"},
{id:"e.control.modcontrol",from:"c.control",to:"c.modcontrol",type:"prereq",label:"先修",origin:"add",
 note:"补充图：自动控制原理 → 现代控制理论。古典控制理论是状态空间方法的前置。"},
{id:"e.signals.comm",from:"c.signals",to:"c.comm",type:"prereq",label:"先修",origin:"add",
 note:"合理推断：通信原理大量使用频谱、滤波与调制分析，是信号与系统在“传输信息”方向的应用。"},
{id:"e.comm.random_sig",from:"c.random_sig",to:"c.comm",type:"apply",label:"应用",origin:"add",
 note:"补充图：随机信号分析被用于通信中的噪声与信道建模（应用关系）。"},
/* ================= 三、数字系统：硬件实现层级（主框架图） ================= */

{id:"e.lv.circuit.logic",from:"t.lv_circuit",to:"t.lv_logic",type:"compose",label:"构成",origin:"orig",

 note:"合理推断：框架图“器件级”的典型概念是晶体管与 MOS 管，本站把它对应到半导体器件与微电子基础课程。"},
{id:"e.lv.logic.diglogic",from:"t.lv_logic",to:"c.diglogic",type:"layer",label:"层级对应",origin:"orig",
 note:"框架图把“逻辑级”与“数字系统（数字电路、数字逻辑）”并列在同一层，是同一条线的两种画法。"},

{id:"e.lv.system.isa",from:"t.lv_system",to:"c.isa",type:"layer",label:"层级对应",origin:"infer",
 note:"合理推断：硬件实现层级的“系统级”研究对象（指令集、总线、内存）正对应 ISA 这一层——它是硬件层级顶端的对外接口。"},
{id:"e.lv.system.comp_org",from:"t.lv_system",to:"c.comp_org",type:"layer",label:"层级对应",origin:"orig",
 note:"框架图“系统级”的典型概念（指令集、总线、内存）同样由计算机组成原理覆盖，因此本站在图上让两条线汇合。"},
{id:"e.data_rep.diglogic",from:"c.data_rep",to:"c.diglogic",type:"prereq",label:"先修",origin:"infer",

{id:"e.diglogic.comp_org",from:"c.diglogic",to:"c.comp_org",type:"prereq",label:"先修",origin:"orig",

{id:"e.comp_org.isa",from:"c.comp_org",to:"c.isa",type:"prereq",label:"先修",origin:"orig",
 note:"框架图课程链：计算机组成原理 → 指令集架构/处理器执行。"},
{id:"e.isa.asm",from:"c.isa",to:"c.asm",type:"prereq",label:"先修",origin:"orig",
 note:"框架图课程链：指令集架构 → 汇编语言/底层程序。ISA 定义了汇编语言能写什么。"},
{id:"e.comp_org.rtl",from:"c.comp_org",to:"c.rtl",type:"impl",label:"实现",origin:"orig",
 note:"补充图：功能模块（ALU/控制器/寄存器）通过 RTL 与数据通路实现；模块级与逻辑级之间靠 RTL 连接。"},
{id:"e.rtl.diglogic",from:"c.rtl",to:"c.diglogic",type:"impl",label:"实现",origin:"orig",

{id:"e.arch.fpga",from:"c.arch",to:"c.fpga",type:"cross",label:"交叉方向",origin:"orig",
 note:"框架图把“计算机体系结构 / 嵌入式系统 / FPGA 与 HDL”并列在同一末端方框：它们共享硬件结构知识，但研究方向不同。"},
{id:"e.storage.os",from:"c.storage",to:"c.os",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.fpga.diglogic",from:"c.fpga",to:"c.diglogic",type:"apply",label:"应用",origin:"infer",
 note:"合理推断：用 Verilog/VHDL 描述的逻辑最终综合成数字逻辑电路，HDL 是设计数字逻辑的一种手段。"},
{id:"e.semicond.transistor",from:"c.semiconductor",to:"t.transistor",type:"compose",label:"包含",origin:"orig",
 note:"框架图“器件级”的典型概念是 MOS 管与晶体管，本站把它作为半导体器件课程的入口知识点。"},
/* ================= 四、软件 ↔ 硬件之桥（补充图） ================= */
{id:"e.cpp.compiler",from:"c.cpp",to:"c.compiler",type:"apply",label:"被翻译",origin:"orig",

{id:"e.diglogic.circuit",from:"c.diglogic",to:"t.lv_circuit",type:"impl",label:"由电路实现",origin:"orig",

{id:"e.circuit.transistor",from:"t.lv_circuit",to:"t.transistor",type:"impl",label:"由晶体管实现",origin:"orig",
 note:"补充图：电路 → 晶体管。到了这一层，剩下的就是半导体物理，也是本站地图的最底端。"},
{id:"e.asm.os",from:"c.asm",to:"c.os",type:"prereq",label:"先修",origin:"orig",
 note:"框架图课程链：汇编语言/底层程序 → 操作系统/编译器/运行时。"},
{id:"e.asm.compiler",from:"c.asm",to:"c.compiler",type:"prereq",label:"先修",origin:"orig",
 note:"框架图课程链：汇编语言/底层程序 → 操作系统/编译器/运行时（编译器方向）。"},
{id:"e.os.arch",from:"c.os",to:"c.arch",type:"prereq",label:"先修",origin:"orig",
 note:"框架图课程链末端：操作系统/编译器/运行时 → 计算机体系结构/嵌入式系统/FPGA 与 HDL。"},
{id:"e.vm.compiler",from:"c.vm",to:"c.compiler",type:"contrast",label:"对比",origin:"orig",
 note:"原网页强调：解释器与编译器“虽然有关联，但职责不同”。两者都把程序变成可执行形式，但时机与方式不同，不能互相替代。"},
{id:"e.os.compiler",from:"c.os",to:"c.compiler",type:"contrast",label:"对比",origin:"orig",
 note:"原网页：操作系统、编译器、解释器、虚拟机“虽然有关联，但职责不同”。它们同属系统软件，但解决的问题不同。"},
/* ================= 五、算法、程序设计与系统软件内部 ================= */
{id:"e.ds.algodesign",from:"c.ds",to:"c.algodesign",type:"prereq",label:"先修",origin:"orig",
 note:"数据结构提供表示、算法提供步骤，两者互为支撑，本站按学习顺序把它们连成先修关系（先会表示，再谈策略）。"},

 note:"合理推断：数学板块的计算复杂性给出理论边界（能不能算、难到什么程度），算法板块的复杂度与正确性给出具体分析方法。"},
{id:"e.ds.db",from:"c.ds",to:"c.db",type:"apply",label:"应用",origin:"infer",

{id:"e.ds.os",from:"c.ds",to:"c.os",type:"apply",label:"应用",origin:"infer",

{id:"e.ds.compiler",from:"c.ds",to:"c.compiler",type:"apply",label:"应用",origin:"infer",

{id:"e.fft.algodesign",from:"t.dsp_fft",to:"c.algodesign",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.adv_algo.ai",from:"c.adv_algo",to:"c.ai_foundation",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.mathbase.ai",from:"c.mathbase",to:"c.ai_foundation",type:"cross",label:"交叉应用",origin:"orig",
 note:"原网页人工智能板块明确列出“数学与算法基础：线性代数、概率统计、微积分”，与数学板块内容共享——同一知识只创建一次，用交叉关系连接。"},
{id:"e.cpp.ds",from:"c.cpp",to:"c.ds",type:"prereq",label:"先修",origin:"infer",

{id:"e.progorg.se",from:"c.prog_org",to:"c.se",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.tools.se",from:"c.tools",to:"c.se",type:"apply",label:"应用",origin:"orig",

{id:"e.tools.test",from:"c.tools",to:"c.test",type:"apply",label:"应用",origin:"infer",

{id:"e.plt.compiler",from:"c.plt",to:"c.compiler",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.plt.vm",from:"c.plt",to:"c.vm",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.os.net",from:"c.os",to:"c.net",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.os.db",from:"c.os",to:"c.db",type:"cross",label:"交叉应用",origin:"infer",

{id:"e.db.dbsys",from:"c.db",to:"c.dbsys",type:"prereq",label:"先修",origin:"infer",

{id:"e.file.db",from:"c.file",to:"c.db",type:"prereq",label:"先修",origin:"infer",

/* ---------------- 知识库：索引、合并、自检 ---------------- */
const KB={nodes:[],edges:[],frames:[],routes:[],views:{},byId:{},edgeById:{},custom:{nodes:[],edges:[]},errors:[],warns:[]};
function buildKB(){
  const builtin=[].concat(KB_MODULES,KB_COURSES,KB_TOPICS,KB_EXTRA);
  const custom=KB.custom&&Array.isArray(KB.custom.nodes)?KB.custom.nodes:[];
  const customE=KB.custom&&Array.isArray(KB.custom.edges)?KB.custom.edges:[];
  KB.nodes=builtin.concat(custom);
  KB.edges=[].concat(KB_EDGES,customE);
  KB.frames=KB_FRAMES;KB.routes=KB_ROUTES;KB.views=KB_VIEWS||{};
  KB.byId={};KB.edgeById={};
  KB.nodes.forEach(n=>{if(n&&n.id)KB.byId[n.id]=n});
  KB.edges.forEach(e=>{if(e&&e.id)KB.edgeById[e.id]=e});
  validateKB();
}
function validateKB(){
  const errors=[],warns=[],seen=new Set();
  KB.nodes.forEach(n=>{
    if(!n||!n.id){errors.push('存在缺少 id 的节点：'+JSON.stringify(n).slice(0,70));return}
    if(seen.has(n.id))errors.push('节点 id 重复：'+n.id);else seen.add(n.id);
    if(!n.title)warns.push(n.id+' 缺少 title');
    if(!TYPE_NAME[n.type])warns.push(n.id+' 的 type 不在 module/course/topic/domain 之内：'+n.type);
    if(n.parent&&!KB.byId[n.parent])errors.push(n.id+' 的 parent 不存在：'+n.parent);
  });
  const eseen=new Set();
  KB.edges.forEach(e=>{
    if(!e||!e.id){errors.push('存在缺少 id 的关系');return}
    if(eseen.has(e.id))errors.push('关系 id 重复：'+e.id);else eseen.add(e.id);
    if(!KB.byId[e.from])errors.push(e.id+' 的起点不存在：'+e.from);
    if(!KB.byId[e.to])errors.push(e.id+' 的终点不存在：'+e.to);
    if(!R_TYPE[e.type])errors.push(e.id+' 的关系类型未知：'+e.type);
  });
  KB.frames.forEach(f=>{
    (f.nodes||[]).forEach(n=>{if(!KB.byId[n.kb])errors.push('框架图 '+f.id+' 中的节点未定义：'+n.kb)});
    (f.links||[]).forEach(l=>{if(!KB.edgeById[l.e])errors.push('框架图 '+f.id+' 引用了不存在的关系：'+l.e)});
  });
  KB.errors=errors;KB.warns=warns;
  if(errors.length)console.warn('知识库自检发现问题：',errors);
}
function nodeById(id){return KB.byId[id]||null}
function edgeById(id){return KB.edgeById[id]||null}
function nodesOfType(t){return KB.nodes.filter(n=>n.type===t)}
function childrenOf(id){return KB.nodes.filter(n=>n.parent===id)}
function moduleOf(n){
  let cur=n,guard=0;
  while(cur&&cur.type!=='module'&&cur.parent&&guard++<20)cur=nodeById(cur.parent);
  return cur&&cur.type==='module'?cur:null;
}
function courseOf(n){
  let cur=n,guard=0;
  while(cur&&cur.type!=='course'&&cur.parent&&guard++<20)cur=nodeById(cur.parent);
  return cur&&cur.type==='course'?cur:null;
}
function edgesOf(id,types){
  return KB.edges.filter(e=>(e.from===id||e.to===id)&&(!types||types.indexOf(e.type)>=0));
}
function edgesBetween(a,b){return KB.edges.filter(e=>(e.from===a&&e.to===b)||(e.from===b&&e.to===a))}
function frameHasNode(f,id){return (f.nodes||[]).some(n=>n.kb===id)}
function framesOfNode(id){return KB.frames.filter(f=>frameHasNode(f,id))}

function anchorOf(n,side){
  if(side==='t')return [n.x+n.w/2,n.y];
  if(side==='b')return [n.x+n.w/2,n.y+n.h];
  if(side==='l')return [n.x,n.y+n.h/2];
  return [n.x+n.w,n.y+n.h/2];
}
function orthoPath(a,b,fs,ts,wp){
  const p=anchorOf(a,fs||'b'),q=anchorOf(b,ts||'t');
  let pts=[p];
  if(wp&&wp.length){pts=pts.concat(wp);}
  else{
    const v1=(fs==='t'||fs==='b'||!fs),v2=(ts==='t'||ts==='b'||!ts);
    if(v1&&v2){const my=(p[1]+q[1])/2;pts.push([p[0],my],[q[0],my]);}
    else if(!v1&&!v2){const mx=(p[0]+q[0])/2;pts.push([mx,p[1]],[mx,q[1]]);}
    else if(v1){pts.push([p[0],q[1]]);}
    else{pts.push([q[0],p[1]]);}
  }
  pts.push(q);
  const out=[pts[0]];
  for(let i=1;i<pts.length;i++){
    const A=out[out.length-1],B=pts[i];
    if(Math.abs(A[0]-B[0])>0.6||Math.abs(A[1]-B[1])>0.6)out.push(B);
  }
  const d='M'+out.map(pt=>pt[0].toFixed(1)+' '+pt[1].toFixed(1)).join(' L ');
  const mi=Math.max(0,Math.floor((out.length-1)/2));
  const mid=[(out[mi][0]+out[Math.min(mi+1,out.length-1)][0])/2,(out[mi][1]+out[Math.min(mi+1,out.length-1)][1])/2];
  return {d:d,mid:mid};
}
function wrapText(str,max){
  const s=String(str||''),lines=[];
  const parts=s.split('·');
  let cur='';
  parts.forEach(p=>{
    const next=cur?cur+'·'+p:p;
    if(next.length>max&&cur){lines.push(cur);cur=p;}
    else cur=next;
  });
  if(cur)lines.push(cur);
  return lines.slice(0,3);
}
function frameSVG(f){
  const W=f.w||1000,H=f.h||620;
  const fn={};/* 同一课程可在图内出现多次：优先用 key 定位，缺省用 kb（首个同 kb 节点） */
  (f.nodes||[]).forEach(n=>{if(n.key)fn[n.key]=n;if(!(n.kb in fn))fn[n.kb]=n;});
  let s='<svg class="fsvg" viewBox="0 0 '+W+' '+H+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(f.title)+'">';
  s+='<defs>';
  Object.keys(R_TYPE).forEach(k=>{
    s+='<marker id="arw-'+k+'" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="'+R_TYPE[k].color+'"/></marker>';
  });
  s+='</defs>';
  (f.links||[]).forEach(l=>{
    const e=edgeById(l.e);if(!e)return;
    const a=fn[l.from||e.from],b=fn[l.to||e.to];if(!a||!b)return;
    const r=R_TYPE[e.type]||R_TYPE.apply;
    const g=orthoPath(a,b,l.fs,l.ts,l.wp);
    const dash=(l.dash!==undefined?l.dash:r.dash)?' stroke-dasharray="7 5"':'';
    s+='<g class="fedge" data-edge="'+e.id+'"><title>'+esc(r.name+'：'+(e.label||r.name)+' — '+(e.note||r.desc))+'</title>'+
      '<path d="'+g.d+'" stroke="'+r.color+'"'+dash+' marker-end="url(#arw-'+e.type+')"'+(l.bidir||e.bidir?' marker-start="url(#arw-'+e.type+')"':'')+'/>'+
      (l.hideLabel?'':'<text class="felab" fill="'+r.color+'" x="'+g.mid[0].toFixed(1)+'" y="'+(g.mid[1]-4).toFixed(1)+'" text-anchor="middle">'+esc(l.label||e.label||r.name)+'</text>')+
      '</g>';
  });
  (f.nodes||[]).forEach(n=>{
    const node=nodeById(n.kb);
    const t=TONE[n.tone||'blue']||TONE.blue;
    const cx=n.x+n.w/2;
    const tl=wrapText(n.label||(node?node.title:''),Math.max(4,Math.floor(n.w/15)));
    const sl=n.sub?wrapText(n.sub,Math.max(6,Math.floor(n.w/13))).slice(0,2):[];
    const totalH=tl.length*19+sl.length*15;
    let ty=n.y+(n.h-totalH)/2+16;
    s+='<g class="fnode" data-kb="'+esc(n.kb)+'" tabindex="0">'+
       '<title>'+esc((node?node.title:n.kb)+' ｜ '+(TYPE_NAME[node?node.type:'']||'节点')+(node&&node.summary?' — '+String(node.summary).slice(0,120):''))+'</title>'+
       '<rect x="'+n.x+'" y="'+n.y+'" width="'+n.w+'" height="'+n.h+'" rx="11" fill="'+t.fill+'" stroke="'+t.stroke+'"/>'+
       '<rect x="'+n.x+'" y="'+(n.y+9)+'" width="5" height="'+(n.h-18)+'" rx="2.5" fill="'+t.bar+'"/>';
    tl.forEach((line,i)=>{s+='<text class="ft" x="'+cx+'" y="'+ty.toFixed(1)+'" text-anchor="middle">'+esc(line)+'</text>';ty+=19});
    sl.forEach(line=>{s+='<text class="fs" x="'+cx+'" y="'+ty.toFixed(1)+'" text-anchor="middle">'+esc(line)+'</text>';ty+=15});
    s+='</g>';
  });
  return s+'</svg>';
}

  box.querySelectorAll('.fnode').forEach(g=>g.addEventListener('keydown',ev=>{if(ev.key==='Enter')go('#/node/'+g.dataset.kb)}));
  box.querySelectorAll('.fedge').forEach(g=>g.addEventListener('click',()=>{

      '<br><a href="#/node/'+a.id+'">查看起点</a> · <a href="#/node/'+b.id+'">查看终点</a>';
  }));
}

function parseImport(text){
  const data=JSON.parse(text);
  let nodes=[],edges=[];
  const isNode=x=>x&&x.id&&(TYPE_NAME[x.type]||(x.title&&!x.from));
  const isEdge=x=>x&&x.from&&x.to;
  if(Array.isArray(data)){data.forEach(x=>{if(isEdge(x))edges.push(x);else if(isNode(x))nodes.push(x)})}
  else{nodes=data.nodes||[];edges=data.edges||[]}
  return {nodes:nodes.filter(isNode),edges:edges.filter(isEdge)};
}
function doImport(merge){
  const out=$('#importOut');
  let parsed;
  try{parsed=parseImport($('#importBox').value.trim())}
  catch(err){out.innerHTML='<div class="note warning">JSON 解析失败：'+esc(err.message)+'</div>';return}
  const errs=[],okNodes=[],okEdges=[];
  const custom=KB.custom||{nodes:[],edges:[]};
  custom.nodes=custom.nodes||[];custom.edges=custom.edges||[];
  const existingN=new Set(KB.nodes.map(n=>n.id)),existingE=new Set(KB.edges.map(e=>e.id));
  parsed.nodes.forEach(n=>{
    if(!n.id||!n.title)return errs.push('节点缺少 id 或 title：'+JSON.stringify(n).slice(0,60));
    if(existingN.has(n.id))return errs.push('节点 id 已存在，跳过：'+n.id);
    if(n.parent&&!existingN.has(n.parent)&&!parsed.nodes.some(x=>x.id===n.parent))errs.push('节点 '+n.id+' 的 parent 既不在本站也不在本次导入中：'+n.parent);
    existingN.add(n.id);custom.nodes.push(n);okNodes.push(n.id);
  });
  parsed.edges.forEach(e=>{
    if(!e.id||!e.from||!e.to)return errs.push('关系缺少 id/from/to：'+JSON.stringify(e).slice(0,60));
    if(existingE.has(e.id))return errs.push('关系 id 已存在，跳过：'+e.id);
    if(!existingN.has(e.from)||!existingN.has(e.to))return errs.push('关系 '+e.id+' 的端点不存在：'+e.from+' → '+e.to);
    if(e.type&&!R_TYPE[e.type])errs.push('关系 '+e.id+' 的类型未知（将按"应用"处理）：'+e.type);
    existingE.add(e.id);custom.edges.push(e);okEdges.push(e.id);
  });
  if(!merge){
    download('kb-imported.json',JSON.stringify({nodes:custom.nodes,edges:custom.edges},null,2));
    out.innerHTML='<div class="note">已按校验结果另存为文件（本次识别：节点 '+okNodes.length+' 个、关系 '+okEdges.length+' 条）。</div>'+errBox(errs);
    return;
  }
  LS.set(CKEY,KB.custom);buildKB();
  out.innerHTML='<div class="note">导入完成：新增节点 '+okNodes.length+' 个、关系 '+okEdges.length+' 条。'+
    (KB.errors.length?'<br><b>注意：合并后自检发现 '+KB.errors.length+' 个问题，可点上方“立即自检”查看。</b>':'')+'</div>'+errBox(errs);
  $('#importBox').value='';renderTree();
}
function errBox(errs){
  return errs.length?'<div class="note warning"><b>有 '+errs.length+' 条未导入：</b><br>'+errs.map(esc).join('<br>')+'</div>':'';
}
function copyText(t,msg){
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(
    ()=>alert(msg||'已复制'),
    ()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
         try{document.execCommand('copy');alert(msg||'已复制')}catch(e){alert('复制失败，请手动选择文本')}ta.remove()});
}
function download(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);

/* 搜索：同时定位板块 / 课程 / 知识点 / 关系 */
function searchIndex(){
  if(searchIndex.cache)return searchIndex.cache;
  const idx=KB.nodes.map(n=>{
    const mod=moduleOf(n),course=courseOf(n);
    const text=[n.title,n.short,n.summary,(n.points||[]).join(' '),(n.tags||[]).join(' '),n.id].join(' ').toLowerCase();
    return {node:n,text:text,where:[mod?mod.title:'',course&&course.id!==n.id?course.title:''].filter(Boolean).join(' › ')};
  });
  const eidx=KB.edges.map(e=>{
    const a=nodeById(e.from),b=nodeById(e.to);
    return {edge:e,text:[a?a.title:'',b?b.title:'',R_TYPE[e.type]?R_TYPE[e.type].name:'',e.label,e.note].join(' ').toLowerCase()};
  });
  searchIndex.cache={idx:idx,eidx:eidx};return searchIndex.cache;
}
function doSearch(q){
  const box=$('#searchResults');
  q=(q||'').trim();
  lastQuery=q;
  if(!q){box.classList.add('hide');box.innerHTML='';return}
  const key=q.toLowerCase(),{idx,eidx}=searchIndex();
  const nodes=idx.filter(x=>x.text.indexOf(key)>=0).slice(0,14);
  const edges=eidx.filter(x=>x.text.indexOf(key)>=0).slice(0,6);
  if(!nodes.length&&!edges.length){box.innerHTML='<div class="sr-group">没有匹配的节点或关系</div>';box.classList.remove('hide');return}
  let h='';
  if(nodes.length){
    h+='<div class="sr-group">节点（板块 / 课程 / 知识点）</div>';
    h+=nodes.map(x=>{
      const n=x.node,mod=moduleOf(n),snippet=String(n.summary||'').slice(0,70);
      return '<button class="sr-item" data-go="#/node/'+n.id+'"><b>'+hl(n.title)+'</b> '+typeBadge(n.type)+
      '<small>'+esc(x.where?x.where+' · ':'')+hl(snippet)+'</small></button>'}).join('');
  }
  if(edges.length){
    h+='<div class="sr-group">关系（箭头）</div>';
    h+=edges.map(x=>{const e=x.edge,a=nodeById(e.from),b=nodeById(e.to);
      return '<button class="sr-item" data-go="#/relations/'+e.type+'"><b>'+esc(a?a.title:'')+'</b> '+rTypeTag(e.type)+' <b>'+esc(b?b.title:'')+'</b>'+
      '<small>'+hl(e.note||e.label||'')+'</small></button>'}).join('');
  }
  h+='<div class="sr-group">进入节点后，匹配的文字会高亮显示</div>';
  box.innerHTML=h;box.classList.remove('hide');
  $$('.sr-item',box).forEach(b=>b.addEventListener('click',()=>{
    box.classList.add('hide');$('#search').blur();go(b.dataset.go);route();
  }));
}

/* ---------------- 启动 ---------------- */
function init(){
  buildKB();renderQuick();renderTree();
  const s=$('#search'),box=$('#searchResults');
  s.addEventListener('input',e=>{searchIndex.cache=null;doSearch(e.target.value);
    treeFilter(e.target.value)});
  s.addEventListener('keydown',e=>{
    if(e.key==='Enter'){const first=$('.sr-item',box);if(first){box.classList.add('hide');go(first.dataset.go);route()} }
    if(e.key==='Escape'){box.classList.add('hide');s.value='';treeFilter('')}
  });
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))box.classList.add('hide')});
  $('#expandAll').addEventListener('click',()=>$$('#tree details').forEach(d=>d.open=true));
  $('#collapseAll').addEventListener('click',()=>$$('#tree details').forEach(d=>d.open=false));
  $('#brand').addEventListener('click',()=>go('#/home'));
  window.addEventListener('hashchange',route);
  route();
  if(KB.errors.length)console.warn('知识库自检：',KB.errors);
}
function treeFilter(q){
  q=(q||'').trim().toLowerCase();
  $$('#tree details').forEach(d=>{
    const id=d.dataset.node,n=nodeById(id);
    if(!n)return;
    const kids=childrenOf(id);
    const own=(String(n.title)+' '+String(n.summary||'')).toLowerCase();
    const kidHit=kids.filter(k=>{
      const sub=childrenOf(k.id);
      if((String(k.title)+' '+String(k.summary||'')).toLowerCase().indexOf(q)>=0)return true;
      return sub.some(s=>(String(s.title)+' '+String(s.summary||'')).toLowerCase().indexOf(q)>=0);
    });
    const hit=!q||own.indexOf(q)>=0||kidHit.length>0;
    d.classList.toggle('hide',!hit);
    if(q&&hit)d.open=true;
    $$('a',d).forEach(a=>{
      const href=a.getAttribute('href')||'';
      if(href.indexOf('#/node/')!==0){return}
      const nid=href.slice(7),node=nodeById(nid);
      const txt=(String(node&&node.title||'')+' '+String(node&&node.summary||'')).toLowerCase();
      a.classList.toggle('hide',!!q&&txt.indexOf(q)<0&&!kidHit.some(k=>k.id===nid));
    });
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
</script>
<script>
(function(){
  var out={};
  function q(s){return document.querySelector(s)}
  function qa(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
  function t(s){var e=q(s);return e?e.innerText.replace(/\s+/g,' ').trim():null}
  /* 先等到页面真正就绪：优先等本路由的关键元素出现，最多等 2 秒（虚拟时间） */
  var h=location.hash;
  var anchor = h.indexOf('#/node/')===0 ? '#doneBox' : (h.indexOf('#/data')===0 ? '#runCheck' : '#view');
  var tries=0;
  (function waitReady(){
    var el=anchor==='#view'?q('#view'):q(anchor);
    var ok = anchor==='#view' ? (el && el.innerText.replace(/s+/g,'').length>200) : !!el;
    if(ok || tries>80){ out.anchorWait=tries; out.anchorOK=!!ok; return go(); }
    tries++; setTimeout(waitReady,25);
  })();
  function go(){
  var steps=[];
  if(h.indexOf('#/node/')===0){
    steps.push(function(){var b=q('#doneBox');if(b){b.click();out.doneClicked=true}else out.missing='#doneBox'});
    steps.push(function(){var n=q('#noteBox');
      if(n){n.value='自动化检查写入的笔记';var sv=q('#saveNote');if(sv){sv.click();out.noteClicked=true;out.noteMsg=t('#noteMsg')}}
      else out.missing2='#noteBox'});
  }
  if(h.indexOf('#/data')===0){ steps.push(function(){var b=q('#runCheck');if(b){b.click();out.checkClicked=true}}); }
  steps.push(function(){
    try{
      var s=q('#search');
      if(!s){ out.searchRan='no-input'; return }
      s.value='傅里叶';
      s.dispatchEvent(new Event('input',{bubbles:true}));
      out.searchRan=true;
    }catch(e){ out.searchErr=String(e.message) }
  });
  var i=0;
  (function next(){
    if(i<steps.length){ try{steps[i++]()}catch(e){ (out.stepErr=out.stepErr||[]).push(String(e.message)) } setTimeout(next,40); return }
    out.hash=location.hash;
    var full=qa('#view').length?q('#view').innerText.replace(/\s+/g,' ').trim():null;
    out.textLen=document.body.innerText.replace(/\s+/g,'').length;
    out.view=full?full.slice(0,4000):null;
    out.counts={mini:qa('.mini').length,card:qa('.content-card').length,fnode:qa('.fnode').length,
      fedge:qa('.fedge').length,ftitle:qa('#frameBox .ft').length,rows:qa('#view table tbody tr').length,
      searchRes:qa('#searchResults .sr-item').length,tree:qa('#tree details').length,relRows:qa('#view .rel-row').length};
    out.checkOut=t('#checkOut');
    out.checkOutHTML=(q('#checkOut')?String(q('#checkOut').innerHTML).replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,150):null);
    out.hasRunCheck=!!q('#runCheck');
    out.searchResults=qa('#searchResults .sr-item').slice(0,4).map(function(a){return a.innerText.replace(/\s+/g,' ').slice(0,60)});
    try{ localStorage.setItem('__probeT','1'); out.lsOK=localStorage.getItem('__probeT');
         out.progRaw=localStorage.getItem('cskb.progress'); out.noteRaw=localStorage.getItem('cskb.notes');
         out.progress=JSON.parse(localStorage.getItem('cskb.progress')||'null');
         out.notes=JSON.parse(localStorage.getItem('cskb.notes')||'null'); }catch(e){ out.lsErr=String(e) }
    out.errs=(window.__errs||[]).slice(0,8);
    out.kbErr=(typeof KB!=='undefined'&&KB.errors)?KB.errors.slice(0,8):null;
    out.kbWarn=(typeof KB!=='undefined'&&KB.warns)?KB.warns.slice(0,8):null;
    var pre=document.createElement('pre');pre.id='PROBE';
    var json=JSON.stringify(out);
    var b64='';try{b64=btoa(unescape(encodeURIComponent(json)))}catch(e){b64='ERR:'+e.message}
    pre.textContent='@@PROBE@@'+b64+'@@ENDPROBE@@';
    document.body.appendChild(pre);
  })();
  }
})();
</script>
</body>
